name: Build Unifill Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Generate launcher icons from logo symbol
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageChops

          src = Image.open('assets/logo-horizontal.png').convert('RGBA')
          rough = src.crop((150, 145, 325, 350)).convert('RGBA')
          rgb = rough.convert('RGB')
          white = Image.new('RGB', rgb.size, 'white')
          bbox = ImageChops.difference(rgb, white).getbbox() or (0, 0, rough.width, rough.height)
          symbol = rough.crop(bbox)

          px = symbol.load()
          for y in range(symbol.height):
              for x in range(symbol.width):
                  r, g, b, a = px[x, y]
                  if r > 247 and g > 247 and b > 247:
                      px[x, y] = (255, 255, 255, 0)

          def scaled(img, height):
              width = round(img.width * height / img.height)
              return img.resize((width, height), Image.Resampling.LANCZOS)

          legacy = Image.new('RGBA', (1024, 1024), (255, 255, 255, 255))
          mark = scaled(symbol, 700)
          legacy.alpha_composite(mark, ((1024 - mark.width) // 2, (1024 - mark.height) // 2))
          legacy.convert('RGB').save('assets/icon.png', format='PNG')

          adaptive = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          mark = scaled(symbol, 610)
          adaptive.alpha_composite(mark, ((1024 - mark.width) // 2, (1024 - mark.height) // 2))
          adaptive.save('assets/adaptive-icon.png', format='PNG')
          PY

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Type check
        run: npm run typecheck

      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK for phone and emulator
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          python3 - <<'PY'
          import zipfile
          apk = 'android/app/build/outputs/apk/release/app-release.apk'
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'AndroidManifest.xml' in names
              assert 'assets/index.android.bundle' in names
              assert any(n.startswith('lib/arm64-v8a/') and n.endswith('.so') for n in names)
              assert any(n.startswith('lib/x86_64/') and n.endswith('.so') for n in names)
              assert any(n.endswith('classes.dex') for n in names)
          print('APK validated for arm64-v8a and x86_64')
          PY
          cp "$APK" Unifill-v1.1.1-bottom-nav-fix.apk
          sha256sum Unifill-v1.1.1-bottom-nav-fix.apk
          ls -lh Unifill-v1.1.1-bottom-nav-fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unifill-v1.1.1-bottom-nav-fix
          path: Unifill-v1.1.1-bottom-nav-fix.apk
          if-no-files-found: error
          retention-days: 14
