name: Build Unifill Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NODE_ENV: development
      APP_ENV: development
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" Unifill-v1.0.0-test.apk
          sha256sum Unifill-v1.0.0-test.apk
          ls -lh Unifill-v1.0.0-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unifill-v1.0.0-test
          path: Unifill-v1.0.0-test.apk
          if-no-files-found: error
          retention-days: 14
