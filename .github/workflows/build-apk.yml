name: Build Unifill Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      APP_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate visible source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f app/index.tsx
          test -f assets/logo-horizontal.png
          grep -q "router.replace" app/index.tsx
          if grep -q "<Redirect" app/index.tsx; then
            echo "Legacy Expo Router Redirect startup code is still present."
            exit 1
          fi
          cp assets/logo-horizontal.png assets/icon.png
          cp assets/logo-horizontal.png assets/splash-icon.png
          cp assets/logo-horizontal.png assets/adaptive-icon.png

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        run: npx expo install --fix

      - name: Type check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/debug/app-debug.apk Unifill-v1.0.0-test.apk
          test -s Unifill-v1.0.0-test.apk
          ls -lh Unifill-v1.0.0-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Unifill-v1.0.0-test
          path: Unifill-v1.0.0-test.apk
          if-no-files-found: error
          retention-days: 14
