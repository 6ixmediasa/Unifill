name: Build Unifill Router-Fixed Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      APP_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and validate Unifill source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, string, sys, zipfile

          parts = [Path(f'.ci/source.part{i:02d}').read_text().strip() for i in range(9)]
          joined = ''.join(parts)

          def valid_zip(b64):
              try:
                  raw = base64.b64decode(b64, validate=True)
                  with zipfile.ZipFile(io.BytesIO(raw)) as z:
                      return z.testzip() is None, raw
              except Exception:
                  return False, None

          ok, raw = valid_zip(joined)
          if not ok:
              # source.part03 is one character shorter than the fixed 16,000-char chunks.
              # Repair the single missing base64 character at that chunk boundary.
              alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + '+/'
              boundary = sum(len(x) for x in parts[:4])
              repaired = None
              for ch in alphabet:
                  candidate = joined[:boundary] + ch + joined[boundary:]
                  ok, candidate_raw = valid_zip(candidate)
                  if ok:
                      repaired = candidate_raw
                      print(f'Repaired CI source payload with base64 character {ch!r} at offset {boundary}.')
                      break
              if repaired is None:
                  raise SystemExit('Unable to repair the CI source payload.')
              raw = repaired

          Path('unifill.zip').write_bytes(raw)
          print(f'Validated source ZIP: {len(raw)} bytes')
          PY
          mkdir -p appsrc
          unzip -q unifill.zip -d appsrc
          cd appsrc
          mkdir -p assets
          cp assets/logo-horizontal.png assets/icon.png
          cp assets/logo-horizontal.png assets/splash-icon.png
          cp assets/logo-horizontal.png assets/adaptive-icon.png
          test -f package.json

      - name: Apply production-safe startup router fix
        shell: bash
        run: |
          cat > appsrc/app/index.tsx <<'EOF'
          import React, { useEffect, useState } from 'react';
          import { router } from 'expo-router';
          import { setting } from '@/src/db/database';
          import { Loading, Screen } from '@/src/components/UI';

          export default function Index() {
            const [destination, setDestination] = useState<'/(tabs)' | '/onboarding' | null>(null);

            useEffect(() => {
              let mounted = true;

              async function bootstrap() {
                try {
                  const complete = await setting('onboarding_complete', '0');
                  if (!mounted) return;
                  setDestination(complete === '1' ? '/(tabs)' : '/onboarding');
                } catch {
                  if (mounted) setDestination('/onboarding');
                }
              }

              bootstrap();
              return () => {
                mounted = false;
              };
            }, []);

            useEffect(() => {
              if (destination) router.replace(destination);
            }, [destination]);

            return (
              <Screen>
                <Loading />
              </Screen>
            );
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: appsrc
        run: npm install --no-audit --no-fund

      - name: Align Expo dependencies
        working-directory: appsrc
        run: npx expo install --fix

      - name: Type check
        working-directory: appsrc
        run: npm run typecheck

      - name: Generate Android project
        working-directory: appsrc
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: appsrc/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          cp appsrc/android/app/build/outputs/apk/debug/app-debug.apk Unifill-v1.0.0-router-fixed-test.apk
          ls -lh Unifill-v1.0.0-router-fixed-test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Unifill-v1.0.0-router-fixed-test
          path: Unifill-v1.0.0-router-fixed-test.apk
          if-no-files-found: error
          retention-days: 14
