name: Publish Unifill Source Tree

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether source is already visible
        id: source
        shell: bash
        run: |
          if [ -f package.json ] && [ -d app ] && [ -d src ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Visible source tree already exists."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct validated router-fixed source
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/router-fixed.part* > /tmp/unifill-source.b64
          base64 --decode /tmp/unifill-source.b64 > /tmp/unifill-source.tar.xz
          echo "2642aff4c0b8bb8c8e1864d1129217197dea0e19a97f2e9d771e44bea218aed5  /tmp/unifill-source.tar.xz" | sha256sum -c -
          xz -t /tmp/unifill-source.tar.xz
          rm -rf /tmp/unifill-expanded
          mkdir -p /tmp/unifill-expanded
          tar -xJf /tmp/unifill-source.tar.xz -C /tmp/unifill-expanded
          test -f /tmp/unifill-expanded/package.json
          test -f /tmp/unifill-expanded/app/index.tsx
          grep -q "router.replace" /tmp/unifill-expanded/app/index.tsx
          if grep -q "<Redirect" /tmp/unifill-expanded/app/index.tsx; then
            echo "Legacy startup Redirect found; refusing to publish."
            exit 1
          fi

      - name: Publish normal repository files
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/unifill-expanded/. ./
          test -f package.json
          test -d app
          test -d src
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Publish visible Unifill source tree"
          git push origin HEAD:main
